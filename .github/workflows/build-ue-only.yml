name: Build UE Mod Only

# Fork-only workflow (`Clackz/Luma-Framework`).
#
# Upstream still ships every game through `build_and_release.yml` (4 configurations
# x 2 platforms, ~39 minutes). This fork only ever needs the single Snowbreak:
# Containment Zone addon, so that matrix is disabled here and this workflow is the
# only one that builds and publishes anything.
#
# Push to `main` -> build only, the packaged zip stays an Actions artifact.
# Manual run    -> build, then create a GitHub Release carrying the zip.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with the packaged addon (uncheck to only produce the Actions artifact)'
        type: boolean
        default: true
      nexus:
        description: 'Also build the Nexus-ready package (drops dxgi.dll / nvngx_dlss.dll, adds LICENSE + attribution)'
        type: boolean
        default: true
      nexus_version:
        description: 'Version string used to name the Nexus package'
        type: string
        default: '1.0'

jobs:
  build-ue-test:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1.2

      - name: Integrate vcpkg with MSBuild
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install'

      # Only the 64-bit ReShade build is needed: package.ps1 copies ReShade64.dll
      # as dxgi.dll for the x64 addon. The 32-bit build is skipped on purpose.
      - name: Build ReShade.sln Release x64
        run: msbuild "Source\External\reshade\ReShade.sln" /p:Configuration="Release" /p:Platform="64-bit" /p:PlatformToolset=v145

      # Build only the Snowbreak Containment Zone addon (main.cpp + Core unity_build.cpp are
      # compiled in this project; there are no project references). No
      # continue-on-error: a compile error must fail the run loudly.
      #
      # Publishing-Release on purpose - it is the configuration Luma ships publicly. It does
      # not define TEST/DEVELOPMENT, so the asserts that only exist in those configs are
      # compiled out and can no longer pop a modal "Assertion failed" message box mid-game
      # (e.g. the AreFormatsCopyCompatible one in core.hpp's MSAA resolve path - upstream
      # code, harmless, but it blocks the render thread while the box is open).
      # Our own UE4-UPSCALE / UE4-SRSTATE / UE4-SKIP diagnostics sit under #if ENABLE_SR and
      # are not affected by the configuration, so nothing is lost by dropping TEST.
      # Note: like TEST, Publishing loads shaders from <game>/Luma/<Project>/, so the shader
      # mount does not change.
      - name: Build Snowbreak Containment Zone addon (Publishing-Release x64)
        shell: pwsh
        run: |
          msbuild Luma.sln /t:"Snowbreak Containment Zone" /p:Configuration="Publishing-Release" /p:Platform="x64" /p:DefineConstants="REMOTE_BUILD=1"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Solution-target build failed, retrying with a direct project build..."
            msbuild "Source\Games\Snowbreak Containment Zone\Snowbreak Containment Zone.vcxproj" /p:Configuration="Publishing-Release" /p:Platform="x64" /p:DefineConstants="REMOTE_BUILD=1" "/p:SolutionDir=$($PWD.Path.Replace('\','/'))/" "/p:SolutionName=Luma"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Package Snowbreak Containment Zone addon
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File "Scripts/package.ps1" -Project "Snowbreak Containment Zone" -Config "Publishing-Release" -Platform "x64" -OutDir "."

      - name: Verify output exists
        shell: pwsh
        run: |
          if (-not (Test-Path "Luma-Snowbreak_Containment_Zone.zip")) {
            Write-Host "::error::Luma-Snowbreak_Containment_Zone.zip was not produced!"
            exit 1
          }
          Get-Item "Luma-Snowbreak_Containment_Zone.zip" | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Snowbreak
          path: Luma-Snowbreak_Containment_Zone.zip
          if-no-files-found: error

  # Builds the archive we actually upload to Nexus, out of the one built above.
  #
  # The upstream packaging (Scripts/package.ps1) always drops its own ReShade build in as
  # dxgi.dll, plus the NGX DLSS runtime when the project opts into UseLumaNGX. Neither
  # belongs in a Nexus upload: dxgi.dll would take the proxy slot the user's own loader or
  # OptiScaler already holds (silently overwriting a working ReShade install), and the
  # ~58 MB NVIDIA runtime is something the user already has a newer copy of beside the game
  # executable. So this job does not rebuild anything - it filters that archive, adds the
  # licence and attribution the Luma licence requires for redistribution, records where the
  # build came from, and fails closed if any file outside the allow-list survives.
  nexus-package:
    name: Build Nexus Package
    needs: build-ue-test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.nexus == 'true'
    runs-on: ubuntu-latest
    steps:
      # Only the licence text is needed from the repository; the mod comes from the artifact.
      - name: Checkout LICENSE.md
        uses: actions/checkout@v4
        with:
          sparse-checkout: LICENSE.md
          sparse-checkout-cone-mode: false

      - name: Download packaged addon
        uses: actions/download-artifact@v4
        with:
          name: Luma-Snowbreak
          path: dist

      # Note on indentation: a YAML block scalar takes its indentation from its first line, so
      # the `@'` / `'@` pair below sits at exactly that level and therefore lands in column 0
      # of the real script - PowerShell requires the closing quote to start a line.
      - name: Filter and repack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ inputs.nexus_version }}"
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.0" }

          $sourceZip = Get-ChildItem -Path dist -Filter *.zip -File | Sort-Object Name | Select-Object -First 1
          if (-not $sourceZip) {
            Write-Host "::error::no packaged zip found under dist/"
            exit 1
          }
          Write-Host "Source archive: $($sourceZip.Name) ($($sourceZip.Length) bytes)"

          $stage = Join-Path $PWD "nexus-stage"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Expand-Archive -LiteralPath $sourceZip.FullName -DestinationPath $stage -Force

          # 1. Drop what must never be redistributed.
          $banned = @(
            "dxgi.dll", "d3d11.dll", "d3d12.dll", "winmm.dll", "version.dll", "dinput8.dll",
            "nvngx_dlss.dll", "nvngx_dlssd.dll", "nvngx_dlssg.dll", "nvngx.dll"
          )
          $dropped = @()
          foreach ($name in $banned) {
            Get-ChildItem -Path $stage -Recurse -File -Filter $name | ForEach-Object {
              $dropped += $_.FullName.Substring($stage.Length).TrimStart('\', '/')
              Remove-Item -LiteralPath $_.FullName -Force
            }
          }
          if ($dropped.Count -eq 0) {
            Write-Host "::warning::nothing was dropped - did upstream stop shipping dxgi.dll / nvngx_dlss.dll?"
          } else {
            $dropped | ForEach-Object { Write-Host "  dropped: $_" }
          }

          # 2. What is left still has to be a working mod.
          $addon = @(Get-ChildItem -Path $stage -Filter *.addon -File)
          if ($addon.Count -ne 1) {
            Write-Host "::error::expected exactly one .addon at the archive root, found $($addon.Count)"
            exit 1
          }
          foreach ($mount in @("Luma/Global", "Luma/Includes", "Luma/Snowbreak Containment Zone")) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage $mount))) {
              Write-Host "::error::missing shader mount: $mount"
              exit 1
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $stage "Luma/d3dcompiler_47.dll"))) {
            Write-Host "::error::Luma/d3dcompiler_47.dll is missing - the mod cannot compile its shaders without it"
            exit 1
          }

          # 3. Licence and attribution travel with the archive. The Luma licence allows
          #    redistribution with attribution and asks to be contacted first for commercial
          #    use, so shipping the licence text and the credit is not optional.
          Copy-Item -LiteralPath "LICENSE.md" -Destination (Join-Path $stage "LICENSE.md") -Force

          $readme = @'
          Luma for Snowbreak: Containment Zone
          ====================================

          What this is
          ------------
          Super Resolution (DLSS) for Snowbreak: Containment Zone. The game ships without any
          DLSS support at all, and this build adds it. It is a build of the Luma Framework
          running as a ReShade add-on, packaged for Nexus.

          Contents
          --------
            Luma-Snowbreak Containment Zone.addon
                the mod itself
            Luma/Global/ , Luma/Includes/ , Luma/Snowbreak Containment Zone/
                the shaders the mod mounts when it runs
            Luma/d3dcompiler_47.dll
                shader compiler the mod uses at runtime
            LICENSE.md
                the licence of the code this build is made from
            SHA256SUMS.txt
                SHA-256 of every file in this archive
            build-info.txt
                which commit this build came from, and what it was built with

          Requirements
          ------------
          ReShade 6.x or newer, with add-on support, must already be installed for the game.
          This archive deliberately does NOT contain ReShade. ReShade loads from a fixed slot,
          usually dxgi.dll, and that slot may already be taken by an existing ReShade install
          or by another tool such as OptiScaler. Writing our own copy there would silently
          overwrite whatever the user already has working.

          Installation
          ------------
          1. Confirm the ReShade overlay opens in game (Home key).
          2. Extract this archive into the folder that holds the game executable, merging
             folders and replacing files when updating.
          3. Launch the game and press Home. The add-on list should now contain Luma.
          4. Open the Luma tab and set Super Resolution to DLSS.

          Notes
          -----
          * Luma's HDR remastering is not exposed in this build, because of a bug.
            With it enabled, leaving a stage and returning to the main lobby could
            leave the loading screen stuck, even though the game itself kept running
            at full frame rate underneath. Switching it off removes the problem, so
            the option is simply not there. The change is in the mod's source. If you
            want HDR remastering, use an upstream Luma build instead - it still has
            this bug.
          * If you do get stuck on a loading screen after leaving a stage, press Esc a
            few times to back out to the main lobby screen. The world starts rendering
            about a second after the lobby screen is up, and the loading screen clears
            with it. While you are still on the stage-result panels it does not clear on
            its own - one run sat there for 99 seconds and never recovered. The game
            itself stays alive and at full frame rate throughout.
          * The first launch after installing or updating compiles the mod's shaders and is
            slower than usual. Later launches are not.
          * If you run OptiScaler as well, do not let either tool replace the other's proxy.

          Credits and licence
          -------------------
          This is a build of the Luma Framework by Filippo Tarpini (Pumbo):
          https://github.com/Filoppi/Luma-Framework
          Used under its licence, which allows redistribution as long as the author is
          credited, and requires asking the author first for commercial use. The full licence
          text is in LICENSE.md, shipped in this archive.
          The rendering work is all his. Only the game-specific preset for Snowbreak:
          Containment Zone, its shaders mount, and the packaging of this archive are ours.

          This mod is free. If you paid for it, you were overcharged.

          中文说明
          ========

          这是什么
          --------
          《尘白禁区》（Snowbreak: Containment Zone）原生不支持 DLSS，本 mod 为其加入
          DLSS 超分。它基于 Luma Framework，以 ReShade 插件的形式运行，本包为 Nexus
          发布版。

          包含内容
          --------
            Luma-Snowbreak Containment Zone.addon
                mod 本体
            Luma/Global/ 、Luma/Includes/ 、Luma/Snowbreak Containment Zone/
                mod 运行时挂载的着色器
            Luma/d3dcompiler_47.dll
                mod 运行时使用的着色器编译器
            LICENSE.md
                本构建所基于代码的许可
            SHA256SUMS.txt
                本包内每个文件的 SHA-256
            build-info.txt
                本构建来自哪个 commit、用什么构建

          前置要求
          --------
          需先为游戏装好 ReShade 6.x 或更新版本（带 add-on 支持）。本 mod 不含 ReShade。
          ReShade 从固定槽位加载（通常是 dxgi.dll），该槽位可能已被你现有的 ReShade
          或 OptiScaler 之类工具占用，写入我们自己的副本会覆盖掉你原本能用的那份。

          安装
          ----
          1. 确认游戏内按 Home 能呼出 ReShade 面板。
          2. 将本压缩包解压到游戏可执行文件所在目录，合并文件夹，更新时覆盖。
          3. 启动游戏并按 Home，插件列表中应出现 Luma。
          4. 打开 Luma 标签页，将 Super Resolution 设为 DLSS。

          注意事项
          --------
          * 本版本未开放 Luma 的 HDR 重制，因为它存在 bug。开启时，退出副本回到主界面
            可能一直卡在加载界面——游戏本身仍在满帧运行，但加载界面不消失。关闭后该
            问题即消失，因此本版本不提供此选项。改动在 mod 源码中。若你需要 HDR 重
            制，请改用上游 Luma 构建——但请注意它同样存在该 bug。
          * 退出副本后若卡在加载界面，连按几次 ESC 退回主界面即可。回到主界面约一秒
            后场景开始渲染，加载界面随之消失。停在副本结算界面时它不会自行消失——我
            们等过 99 秒也未恢复。此期间游戏一直在满帧运行。
          * 安装或更新后的首次启动会编译 mod 的着色器，比平时慢；之后不会。
          * 若你同时使用 OptiScaler，不要让任一工具覆盖对方的代理文件。

          署名与许可
          ----------
          本 mod 基于 Filippo Tarpini（Pumbo）的 Luma Framework 构建：
          https://github.com/Filoppi/Luma-Framework
          遵循其许可使用：允许再分发，但须署名作者；商业用途需事先征得作者同意。完整
          许可文本见包内 LICENSE.md。所有渲染相关工作均由他完成，我们所做的仅为《尘
          白禁区》的游戏预设、对应着色器挂载，以及本包的打包。

          本 mod 为免费分享。如果你是花钱购买的，请尽快退款。
          '@
          Set-Content -Path (Join-Path $stage "README.txt") -Value $readme -Encoding utf8

          # 4. Provenance, so a build can always be traced back to a commit.
          function Get-PeTimeStamp([string]$Path) {
            try {
              $fs = [System.IO.File]::OpenRead($Path)
              try {
                $br = New-Object System.IO.BinaryReader($fs)
                $fs.Position = 0x3C
                $peOffset = $br.ReadInt32()
                $fs.Position = $peOffset + 8
                $seconds = $br.ReadUInt32()
                return ([DateTimeOffset]::FromUnixTimeSeconds($seconds)).UtcDateTime.ToString("yyyy-MM-ddTHH:mm:ssZ")
              } finally { $fs.Dispose() }
            } catch { return "unavailable" }
          }

          $peTs = Get-PeTimeStamp -Path $addon[0].FullName
          $addonHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $addon[0].FullName).Hash.ToLowerInvariant()
          $buildInfo = @(
            "Luma for Snowbreak: Containment Zone - Nexus package",
            "version:       $version",
            "commit:        ${{ github.sha }}",
            "ref:           ${{ github.ref_name }}",
            "workflow run:  ${{ github.run_id }} (build ${{ github.run_number }})",
            "configuration: Publishing-Release / x64 (not TEST, not DEVELOPMENT)",
            "addon:         $($addon[0].Name)",
            "addon size:    $($addon[0].Length) bytes",
            "addon sha256:  $addonHash",
            "addon PE TimeDateStamp: $peTs",
            "generated:     $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
          ) -join "`n"
          Set-Content -Path (Join-Path $stage "build-info.txt") -Value $buildInfo -Encoding utf8

          # 5. Checksums, written after everything else so the file cannot end up listing itself.
          $sums = Get-ChildItem -Path $stage -Recurse -File | Sort-Object FullName | ForEach-Object {
            $rel = $_.FullName.Substring($stage.Length).TrimStart('\', '/') -replace '\\', '/'
            "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant())  $rel"
          }
          Set-Content -Path (Join-Path $stage "SHA256SUMS.txt") -Value $sums -Encoding utf8

          # 6. Fail closed. A file outside the allow-list means upstream changed the package
          #    layout: stop and look at it rather than publish something nobody inspected.
          $allowedExt = @(".addon", ".hlsl", ".hlsli", ".h", ".yml", ".txt", ".md")
          $allowedDll = @("d3dcompiler_47.dll")
          $unexpected = @()
          foreach ($f in Get-ChildItem -Path $stage -Recurse -File) {
            $rel = $f.FullName.Substring($stage.Length).TrimStart('\', '/') -replace '\\', '/'
            $ok = $allowedExt -contains $f.Extension.ToLowerInvariant()
            if (-not $ok -and $f.Extension -ieq ".dll") {
              $ok = ($allowedDll -contains $f.Name) -and $rel.StartsWith("Luma/")
            }
            if (-not $ok) { $unexpected += $rel }
          }
          if ($unexpected.Count -gt 0) {
            $unexpected | ForEach-Object { Write-Host "::error::unexpected file in package: $_" }
            exit 1
          }

          Write-Host "Final contents:"
          Get-ChildItem -Path $stage -Recurse -File | ForEach-Object {
            Write-Host "  $($_.FullName.Substring($stage.Length).TrimStart('\', '/'))"
          }

          # 7. Zip.
          $out = Join-Path $PWD "Luma-Snowbreak-Nexus-$version.zip"
          Remove-Item -LiteralPath $out -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $out -Force
          $zip = Get-Item -LiteralPath $out
          Write-Host "Nexus package: $($zip.Name) / $($zip.Length) bytes"
          Write-Host "sha256: $((Get-FileHash -Algorithm SHA256 -LiteralPath $out).Hash.ToLowerInvariant())"

      - name: Upload Nexus package
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Snowbreak-Nexus
          path: Luma-Snowbreak-Nexus-*.zip
          if-no-files-found: error

  # Publishes the zip produced above as a GitHub Release.
  #
  # Only runs on a manual dispatch with the "release" input left checked. A normal
  # push to main never creates a release, so routine commits do not spawn a new
  # version number every time.
  #
  # `permissions: contents: write` is required: this repository defaults to read-only
  # workflow permissions, and no PAT secret is configured (the token input of
  # action-gh-release falls back to the automatic github.token, which only gains
  # write access through this block).
  release:
    name: Publish Release
    # NOTE: this job waits for BOTH upstream jobs. `nexus-package` is skipped unless the
    # "nexus" input is set, and a job whose `needs` was skipped is skipped too - so the
    # condition below has to defeat that with `always()`, guarded by an explicit check on
    # build-ue-test's result so a failed build can never produce a release.
    #
    # This was a real bug, found by running it: with `needs: build-ue-test` alone this job
    # started before `nexus-package` had uploaded its artifact, the Nexus download failed
    # with "Artifact not found", `continue-on-error` swallowed the error, and the release
    # went out with one archive while its body promised two (run 35239084950, tag
    # snowbreak-22). `always()` is required precisely because a skipped `needs` would
    # otherwise skip this job too, which is the common `nexus=false` dispatch.
    needs: [build-ue-test, nexus-package]
    if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' && needs.build-ue-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged addon
        uses: actions/download-artifact@v4
        with:
          name: Luma-Snowbreak
          path: dist

      # Only exists when the "nexus" input was left checked. continue-on-error keeps an
      # ordinary release working when it was not.
      - name: Download Nexus package
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Luma-Snowbreak-Nexus
          path: dist

      - name: Inspect payload
        run: ls -l dist

      # Fail closed. The `continue-on-error` on the download above is what keeps an ordinary
      # (nexus=false) dispatch working, and it is also exactly what hid the missing artifact
      # in run 35239084950 - so when the Nexus package was requested, assert it is here.
      - name: Verify the Nexus package is present when requested
        if: github.event.inputs.nexus == 'true'
        shell: bash
        run: |
          if ! ls dist/*Nexus*.zip >/dev/null 2>&1; then
            echo "::error::nexus=true but dist/ holds no Nexus package - refusing to publish a release whose body promises two archives."
            ls -l dist
            exit 1
          fi
          ls -l dist/*Nexus*.zip

      # The tag deliberately lives in its own `snowbreak-<n>` namespace instead of the
      # upstream `latest-<n>` scheme: this repository still carries ~350 orphaned
      # `latest-*` tags from earlier full-matrix runs, and reusing that namespace would
      # make the run number collide with an existing tag - action-gh-release would then
      # attach the new release to whatever commit that old tag points at.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snowbreak-${{ github.run_number }}
          name: Release (Build ${{ github.run_number }})
          body: |
            Luma for **Snowbreak: Containment Zone** - fork build, x64 addon only.

            - Built from commit ${{ github.sha }}
            - Configuration: `Publishing-Release` / `x64`
            - Archive contents: `Luma-Snowbreak_Containment_Zone.addon`, its `Luma/Snowbreak Containment Zone/` shader mount, and the shared runtime files

            The attached archives hold the same add-on and differ only in packaging. The second
            one is produced when the build was dispatched with the Nexus option:

            - `Luma-Snowbreak_Containment_Zone.zip` - upstream-style package. Also carries ReShade as `dxgi.dll`, so it can be dropped into a game folder that has no ReShade yet.
            - `Luma-Snowbreak-Nexus-<version>.zip` - for the Nexus upload. No `dxgi.dll` and no `nvngx_dlss.dll`, plus the licence text, a credit file and `SHA256SUMS.txt`.

            Installation
            ------------
            1. Extract the archive directly into the game folder (the one containing the game executable), replacing the previous files when updating.
            2. Boot the game and press `Home` to bring up the ReShade and Luma menus. If they do not appear, ReShade or Luma failed to load.

            This release only contains this game's mod. It is not the full multi-game Luma package.
          files: |
            dist/*.zip
          draft: false
          prerelease: false
