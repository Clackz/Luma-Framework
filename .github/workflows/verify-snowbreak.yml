name: Verify Snowbreak build (PR scaffolding)

# Temporary workflow, used only to prove the Snowbreak project compiles against
# the upstream base. Not part of the pull request itself.
on:
  push:

jobs:
  build-snowbreak:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1.2

      - name: Integrate vcpkg with MSBuild
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install'

      - name: Build ReShade.sln Release x64
        run: msbuild "Source\External\reshade\ReShade.sln" /p:Configuration="Release" /p:Platform="64-bit" /p:PlatformToolset=v145

      # Build the project file directly: "msbuild Luma.sln /t:<name>" does not
      # select a single solution project when the name contains spaces, it
      # forwards the name as a target to every project in the solution.
      - name: Build Snowbreak Containment Zone (Publishing-Release x64)
        shell: pwsh
        run: |
          msbuild "Source\Games\Snowbreak Containment Zone\Snowbreak Containment Zone.vcxproj" /p:Configuration="Publishing-Release" /p:Platform="x64" /p:DefineConstants="REMOTE_BUILD=1" "/p:SolutionDir=$($PWD.Path.Replace('\','/'))/" "/p:SolutionName=Luma"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build Snowbreak Containment Zone (Development-Release x64, asserts on)
        shell: pwsh
        run: |
          msbuild "Source\Games\Snowbreak Containment Zone\Snowbreak Containment Zone.vcxproj" /p:Configuration="Development-Release" /p:Platform="x64" /p:DefineConstants="REMOTE_BUILD=1" "/p:SolutionDir=$($PWD.Path.Replace('\','/'))/" "/p:SolutionName=Luma"
          if ($LASTEXITCODE -ne 0) { exit 1 }
